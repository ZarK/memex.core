name: Publish

# Runs only for a publish tag. Only the owner can create publish-* tags, and nobody can move
# or delete one (repository rulesets). See docs/release-controls.md.
on:
  push:
    tags:
      - "publish-*"

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-source:
    if: startsWith(github.ref, 'refs/tags/publish-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
          package-manager-cache: false

      - name: Verify signed release source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-source.mjs

  publish:
    needs: verify-source
    if: startsWith(github.ref, 'refs/tags/publish-')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: npm-publish
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm (the version in package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Set up npm
        run: npm install -g npm@11.15.0 --ignore-scripts

      - name: Resolve publish tag
        shell: bash
        run: node scripts/resolve-publish-tag.mjs "${GITHUB_REF_NAME}" > publish-plan.json

      - name: Restore staging checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/restore-stage-receipt.mjs publish-plan.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare selected packages
        run: node scripts/run-publish-plan.mjs prepare publish-plan.json

      - name: Verify selected packages
        run: node scripts/run-publish-plan.mjs verify publish-plan.json

      - name: Verify installed packages start
        run: node scripts/verify-installed-packages.mjs --plan publish-plan.json

      - name: Stage selected packages
        run: node scripts/run-publish-plan.mjs stage publish-plan.json

      # npm logs a failed trusted-publishing token exchange only in its debug log.
      - name: Show the npm token exchange result
        if: failure()
        run: grep -h -E "oidc|token/exchange" "$HOME"/.npm/_logs/*-debug-*.log || true
