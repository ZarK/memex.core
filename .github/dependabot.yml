version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # The same 14-day age as .npmrc and pnpm-workspace.yaml. Our own packages are exempt.
    cooldown:
      default-days: 14
      exclude:
        - "@tjalve/*"
    # The Node types follow the oldest Node the packages support (engines), not the newest Node.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
