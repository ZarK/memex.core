components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: The token of this launch, from running.tokenFile.
  responses:
    Error:
      description: The one error body of contracts/surfaces.md.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Error: { $ref: "../schemas/surfaces/error.json" }
    Health:
      type: object
      required: ["status", "app", "version"]
      properties:
        status: { enum: ["ok", "draining"], description: "draining after POST /v1/drain: a newer copy takes over. A client reads the app record again." }
        app: { const: "user" }
        version: { type: "string" }
    Drain:
      type: object
      required: ["draining", "pid", "version", "held"]
      properties:
        draining: { const: true }
        pid: { type: "integer", minimum: 1, description: "The process that drains. It exits when held is 0, or after the drain time." }
        version: { type: "string" }
        held: { type: "integer", minimum: 0, description: "The calls that User still serves." }
    CapabilityList:
      type: object
      required: ["app", "version", "capabilities", "openapi"]
      properties:
        app: { const: "user" }
        version: { type: "string" }
        openapi: { const: "/api/v1/openapi.json" }
        capabilities:
          type: array
          items:
            type: object
            required: ["id", "title", "kind", "description"]
            properties:
              id: { type: "string" }
              title: { type: "string" }
              kind: { enum: ["read", "write"] }
              description: { type: "string", maxLength: 600 }
    Record: { $ref: "../schemas/user/record.json" }
    Claim: { $ref: "../schemas/user/claim.json" }
    Correction: { $ref: "../schemas/user/correction.json" }
    Change: { $ref: "../schemas/user/change.json" }
    ClaimsWriteInput:
      type: object
      required: ["scope", "claims"]
      additionalProperties: false
      properties:
        scope: { $ref: "../schemas/user/common.json#/$defs/scope" }
        partition: { $ref: "../schemas/user/common.json#/$defs/partition" }
        claims:
          type: array
          maxItems: 5000
          items: { $ref: "#/components/schemas/Claim" }
          description: Every claim of the scope or partition. An empty list withdraws all of them.
        generation:
          type: integer
          minimum: 1
          description: The producer's run. Equal to the generation of the claims. Required with an empty claims list when the hub has a generation for the scope or partition.
        dryRun: { type: "boolean", default: false, description: "Check and report; change nothing." }
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
          description: A repeat with the same key returns the first result.
    ClaimsWriteOutput:
      type: object
      required: ["changeId", "summary", "counts", "records"]
      properties:
        changeId: { type: ["string", "null"], description: "null for dryRun, or when nothing changed." }
        summary: { type: "string" }
        counts:
          type: object
          required: ["created", "updated", "unchanged", "withdrawn", "removed"]
          properties:
            created: { type: "integer", minimum: 0 }
            updated: { type: "integer", minimum: 0 }
            unchanged: { type: "integer", minimum: 0 }
            withdrawn: { type: "integer", minimum: 0 }
            removed: { type: "integer", minimum: 0 }
          description: "created, updated, unchanged, and removed count records; withdrawn counts claims."
        records:
          type: array
          description: The record id of each claim key.
          items:
            type: object
            required: ["key", "id"]
            properties:
              key: { type: "string" }
              id: { $ref: "../schemas/user/common.json#/$defs/recordId" }
    ClaimsListInput:
      type: object
      required: ["scope"]
      additionalProperties: false
      properties:
        scope: { $ref: "../schemas/user/common.json#/$defs/scope" }
        partition: { $ref: "../schemas/user/common.json#/$defs/partition" }
        limit: { type: "integer", minimum: 1, maximum: 5000, default: 500 }
        cursor: { type: "string", description: "next of the previous page." }
    ClaimsListOutput:
      type: object
      required: ["items", "next"]
      properties:
        items:
          type: array
          items:
            type: object
            required: ["scope", "claim", "record", "writtenAt"]
            properties:
              scope: { type: "string" }
              partition: { type: "string" }
              claim: { $ref: "#/components/schemas/Claim" }
              record: { $ref: "../schemas/user/common.json#/$defs/recordId" }
              writtenAt: { type: "string", format: "date-time" }
        next: { type: ["string", "null"], description: "null on the last page." }
    CorrectionsWriteInput:
      type: object
      required: ["corrections"]
      additionalProperties: false
      properties:
        corrections:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/Correction" }
          description: With the id and createdAt that the app made; without record for create. The background sync sends them in createdAt order.
        dryRun: { type: "boolean", default: false, description: "Check and report; change nothing." }
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
          description: A repeat with the same key returns the first result. Not needed for corrections, because User stores each correction id once.
    CorrectionsWriteOutput:
      type: object
      required: ["changeId", "summary", "corrections", "results"]
      properties:
        changeId: { type: ["string", "null"], description: "null for dryRun, or when nothing new was stored." }
        summary: { type: "string" }
        corrections:
          type: array
          items: { $ref: "#/components/schemas/Correction" }
          description: As stored, in request order. For a repeat, the correction that User stored earlier, with its own id.
        results:
          type: array
          items: { $ref: "#/components/schemas/CorrectionResult" }
          description: One result for each correction of the request, in request order. results[i].id is the id of the i-th correction of the request, also for a repeat.
    CorrectionResult:
      type: object
      required: ["id", "status", "repeat"]
      additionalProperties: false
      properties:
        id:
          $ref: "../schemas/user/common.json#/$defs/correctionId"
          description: The id of the i-th correction of the request, also for a repeat. The app finds its outbox item by it.
        status:
          enum: ["applied", "superseded", "held"]
          description: "applied: the correction applies (see overridden). superseded: corrections with a later createdAt win completely; it stays in the history. held: stored and not applied; see reason."
        repeat: { type: "boolean", description: "true when User had stored this id, or this create, before. Nothing new is stored, except the new id of a repeated create as an alias." }
        repeatOf:
          $ref: "../schemas/user/common.json#/$defs/correctionId"
          description: Only for a create that repeats an earlier create with another id. The id of the earlier correction. User stores the new id as its alias, so a later send of the new id is a repeat by id.
        record:
          $ref: "../schemas/user/common.json#/$defs/recordId"
          description: The record that holds the fact now (the new record of a create, the merge target of a merged record, the first id of a merge). A held result has it whenever User knows the record.
        version: { type: "integer", minimum: 1, description: "The version of record after the write." }
        state: { enum: ["active", "rejected"], description: "The state of record after the write." }
        overridden:
          type: array
          minItems: 1
          items: { type: "string" }
          uniqueItems: true
          description: set or clear only. The fields for which a correction with a later createdAt wins.
        reason:
          type: object
          required: ["code", "message"]
          additionalProperties: false
          properties:
            code:
              enum: ["required-field", "record-rejected", "record-removed", "unknown-record"]
              description: "required-field: a clear would leave a required field without a value. record-rejected: a create repeats a create whose record the person rejected. record-removed: the record lost all its claims; User applies the correction again when it comes back. unknown-record: User does not know the record id."
            message: { type: "string", description: "A sentence for the app." }
      allOf:
        - if: { properties: { status: { const: "held" } } }
          then: { required: ["reason"] }
          else: { not: { required: ["reason"] } }
        - if: { required: ["repeatOf"] }
          then: { properties: { repeat: { const: true } } }
    CorrectionsListInput:
      type: object
      additionalProperties: false
      properties:
        record: { $ref: "../schemas/user/common.json#/$defs/recordId" }
        limit: { type: "integer", minimum: 1, maximum: 5000, default: 500 }
        cursor: { type: "string", description: "next of the previous page." }
    CorrectionsListOutput:
      type: object
      required: ["items", "next"]
      properties:
        items: { type: "array", items: { $ref: "#/components/schemas/Correction" } }
        next: { type: ["string", "null"], description: "null on the last page." }
    ChangesListInput:
      type: object
      additionalProperties: false
      properties:
        since:
          type: string
          description: "The cursor of the last change that the app applied. Without it: every record."
        kinds:
          type: array
          items: { $ref: "../schemas/user/common.json#/$defs/kind" }
          uniqueItems: true
        limit: { type: "integer", minimum: 1, maximum: 5000, default: 500 }
    ChangesListOutput:
      type: object
      required: ["items", "next"]
      properties:
        items: { type: "array", items: { $ref: "#/components/schemas/Change" } }
        next: { type: ["string", "null"], description: "null on the last page." }
    ListInput:
      type: object
      additionalProperties: false
      properties:
        from: { $ref: "../schemas/user/common.json#/$defs/partialDate" }
        to: { $ref: "../schemas/user/common.json#/$defs/partialDate" }
        person:
          $ref: "../schemas/user/common.json#/$defs/personRef"
          description: The owner's id or a Contacts reference. User follows Contacts redirects, so a reference to a merged person finds the records of the person it was merged into.
        review: { type: "boolean", description: "true: only records for the review list." }
        includeRejected: { type: "boolean", default: false }
        limit: { type: "integer", minimum: 1, maximum: 1000, default: 100 }
        cursor: { type: "string", description: "next of the previous page." }
    RecordPage:
      type: object
      required: ["items", "next"]
      properties:
        items: { type: "array", items: { $ref: "#/components/schemas/Record" } }
        next: { type: ["string", "null"], description: "null on the last page." }
    GetInput:
      type: object
      required: ["id"]
      additionalProperties: false
      properties: { id: { $ref: "../schemas/user/common.json#/$defs/recordId" } }
    RecordEnvelope:
      type: object
      required: ["record"]
      properties: { record: { $ref: "#/components/schemas/Record" } }
