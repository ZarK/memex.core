openapi: "3.1.0"
info:
  title: Memex.User API
  version: "1"
  summary: Facts about the owner, fused from the claims of every app, with corrections and a change feed.
  description: |-
    The contract text is contracts/user-records.md (version 2). The rules that Memex.User shares with
    Memex.Contacts (claims, joins, combining, provenance, corrections, the outbox, and the change feed)
    are in contracts/facts.md. The record shapes are in schemas/user/ and schemas/facts/.

    User follows contracts/surfaces.md like every app: it listens on 127.0.0.1 on a port that the
    OS gives, with a new token at each launch, and the app record <apps>/user.json gives running.url and
    running.tokenFile. Every call except /health sends "Authorization: Bearer <token>". User has no pipe
    or socket. It runs on its own pinned Node.js runtime. Errors use the one error body of
    contracts/surfaces.md.

    Homes, workplaces, and named places that the person enters are records that the person made
    (create, set, clear, reject, restore), never claims. An edit of the person is always accepted:
    the app saves it in its own database with the correction in a durable outbox, and a background sync
    sends the outbox to User, with retries, whenever User can be reached.
  license: { name: "MIT", identifier: "MIT" }
servers:
  - url: "http://127.0.0.1:{port}"
    variables: { port: { default: "0", description: "running.url in <apps>/user.json." } }
security: [{ bearer: [] }]
tags:
  - { name: "service" }
  - { name: "claims" }
  - { name: "corrections" }
  - { name: "changes" }
  - { name: "persons" }
  - { name: "homes" }
  - { name: "workplaces" }
  - { name: "places" }
  - { name: "stays" }
  - { name: "trips" }
  - { name: "chapters" }
  - { name: "milestones" }
paths:
  /health:
    get:
      tags: ["service"]
      operationId: getHealth
      summary: Health without paths or user data
      security: []
      responses:
        "200":
          description: User runs.
          content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } }
        "421": { $ref: "#/components/responses/Error" }
  /v1/drain:
    post:
      tags: ["service"]
      operationId: drain
      summary: A newer copy takes over (the service launcher, before it starts the newer copy)
      description: "User stops taking new work, gives up its single-instance lock, and never writes the app record again. It answers GET /health with status draining and refuses every other request with 503 draining before it starts any work. It finishes the calls that it holds, and stops when it holds none, or after its drain time (60 seconds; memex-user serve --drain-timeout-seconds). A repeated drain gets the same answer. The generated clients leave this operation out: only the service launcher sends it (contracts/surfaces.md, Service launcher)."
      responses:
        "202":
          description: User drains. It no longer holds the single-instance lock, so a newer copy can start.
          content: { application/json: { schema: { $ref: "#/components/schemas/Drain" } } }
        "401": { $ref: "#/components/responses/Error" }
        "421": { $ref: "#/components/responses/Error" }
  /api/v1:
    get:
      tags: ["service"]
      operationId: listCapabilities
      summary: The capabilities of User
      responses:
        "200":
          description: Capabilities.
          content: { application/json: { schema: { $ref: "#/components/schemas/CapabilityList" } } }
        "401": { $ref: "#/components/responses/Error" }
        "421": { $ref: "#/components/responses/Error" }
  /api/v1/openapi.json:
    get:
      tags: ["service"]
      operationId: getOpenApi
      summary: This API as OpenAPI 3.1 JSON
      responses:
        "200": { description: "OpenAPI.", content: { application/json: { schema: { type: "object" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "421": { $ref: "#/components/responses/Error" }
  /api/v1/user.claims.write:
    post:
      tags: ["claims"]
      operationId: claimsWrite
      summary: user.claims.write
      description: "Replace the claims of one scope, or of one partition of a scope. Claims of the scope that are not in the request are withdrawn. Every claim of a request has the same generation; a request with a lower generation than the last one of the scope or partition is refused with 409 conflict (code stale-generation), so a late retry never replaces newer claims. HTTP only; not on MCP. Kind: write."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ClaimsWriteInput" } } }
      responses:
        "200":
          description: Result.
          content: { application/json: { schema: { $ref: "#/components/schemas/ClaimsWriteOutput" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "421": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/user.claims.list:
    post:
      tags: ["claims"]
      operationId: claimsList
      summary: user.claims.list
      description: "List the claims of one scope, with the record of each claim. Kind: read. MCP tool: user_claims_list. GET with ?input=<json> works as well."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ClaimsListInput" } } }
      responses:
        "200":
          description: Result.
          content: { application/json: { schema: { $ref: "#/components/schemas/ClaimsListOutput" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "421": { $ref: "#/components/responses/Error" }
  /api/v1/user.corrections.write:
    post:
      tags: ["corrections"]
      operationId: correctionsWrite
      summary: user.corrections.write
      description: "Store corrections of the user (at most 500). Inference never changes them. Each correction has the id and createdAt that the app made when the person acted. User stores each id once: a correction with an id that User has stored returns the earlier correction and its result now, with repeat true, and stores nothing new. User orders corrections by createdAt, then by arrival; for the same field of the same record, the later createdAt wins, and every correction stays in the history. A create with sources is a repeat when an earlier create has the same kind, sources, and fields: it returns the earlier correction, with record set to the record that holds the fact now (the merge target after a merge), and makes no new record; User stores the new id as an alias of the earlier correction, and the result has the new id and repeatOf. results gives one result for each correction, in request order, and results[i].id is always the id of the i-th correction of the request: applied, superseded (a later createdAt wins completely), or held (stored, not applied, with a reason: required-field, record-rejected, record-removed, or unknown-record). User never drops a correction and has no 404, 409, or 422 here; 400 means the request is wrong and nothing is stored. Kind: write. MCP tool: user_corrections_write."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CorrectionsWriteInput" } } }
      responses:
        "200":
          description: Result.
          content: { application/json: { schema: { $ref: "#/components/schemas/CorrectionsWriteOutput" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "421": { $ref: "#/components/responses/Error" }
  /api/v1/user.corrections.list:
    post:
