components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: The token of this launch, from running.tokenFile.
  responses:
    Error:
      description: The one error body of contracts/surfaces.md.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Error: { $ref: "../schemas/surfaces/error.json" }
    Record: { $ref: "../schemas/contacts/record.json" }
    Claim: { $ref: "../schemas/contacts/claim.json" }
    Correction: { $ref: "../schemas/contacts/correction.json" }
    Change: { $ref: "../schemas/contacts/change.json" }
    ClaimsWriteInput:
      type: object
      required: ["scope", "claims"]
      additionalProperties: false
      properties:
        scope: { $ref: "../schemas/contacts/common.json#/$defs/scope" }
        partition: { $ref: "../schemas/user/common.json#/$defs/partition" }
        claims:
          type: array
          maxItems: 5000
          items: { $ref: "#/components/schemas/Claim" }
          description: Every claim of the scope or partition. An empty list withdraws all of them.
        generation:
          type: integer
          minimum: 1
          description: The producer's run. Equal to the generation of the claims. Required with an empty claims list when the hub has a generation for the scope or partition.
        dryRun: { type: "boolean", default: false, description: "Check and report; change nothing." }
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
          description: A repeat with the same key returns the first result.
    ClaimsWriteOutput:
      type: object
      required: ["changeId", "summary", "counts", "records"]
      properties:
        changeId: { type: ["string", "null"], description: "null for dryRun, or when nothing changed." }
        summary: { type: "string" }
        counts:
          type: object
          required: ["created", "updated", "unchanged", "withdrawn", "removed", "unresolved"]
          properties:
            created: { type: "integer", minimum: 0 }
            updated: { type: "integer", minimum: 0 }
            unchanged: { type: "integer", minimum: 0 }
            withdrawn: { type: "integer", minimum: 0 }
            removed: { type: "integer", minimum: 0 }
            unresolved: { type: "integer", minimum: 0 }
          description: "created, updated, unchanged, and removed count records; withdrawn and unresolved count claims. An unresolved claim is stored and joins a record when its subject resolves."
        records:
          type: array
          description: The record id of each claim key whose subject resolves; null while it does not.
          items:
            type: object
            required: ["key", "id"]
            properties:
              key: { type: "string" }
              id:
                oneOf:
                  - { $ref: "../schemas/contacts/common.json#/$defs/recordId" }
                  - { type: "null" }
    CorrectionsWriteInput:
      type: object
      required: ["corrections"]
      additionalProperties: false
      properties:
        corrections:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/Correction" }
          description: With the id and createdAt that the app made; without record for create. The outbox sends them in createdAt order.
        dryRun: { type: "boolean", default: false, description: "Check and report; change nothing." }
    CorrectionsWriteOutput:
      type: object
      required: ["changeId", "summary", "corrections", "results"]
      properties:
        changeId: { type: ["string", "null"], description: "null for dryRun, or when nothing new was stored." }
        summary: { type: "string" }
        corrections:
          type: array
          items: { $ref: "#/components/schemas/Correction" }
          description: As stored, in request order. For a repeat, the correction that Contacts stored earlier, with its own id.
        results:
          type: array
          items: { $ref: "#/components/schemas/CorrectionResult" }
          description: One result for each correction of the request, in request order.
    CorrectionResult:
      type: object
      required: ["id", "status", "repeat"]
      additionalProperties: false
      properties:
        id: { $ref: "../schemas/user/common.json#/$defs/correctionId" }
        status: { enum: ["applied", "superseded", "held"] }
        repeat: { type: "boolean" }
        repeatOf: { $ref: "../schemas/user/common.json#/$defs/correctionId" }
        record:
          $ref: "../schemas/contacts/common.json#/$defs/recordId"
          description: The record that holds the fact now. For a merge, the first id; for an unmerge, the person that came back.
        version: { type: "integer", minimum: 1 }
        state: { enum: ["active", "rejected"] }
        overridden: { type: "array", minItems: 1, items: { type: "string" }, uniqueItems: true }
        reason:
          type: object
          required: ["code", "message"]
          additionalProperties: false
          properties:
            code: { $ref: "../schemas/facts/facts.json#/$defs/heldReason" }
            message: { type: "string", description: "A sentence for the app." }
      allOf:
        - if: { properties: { status: { const: "held" } } }
          then: { required: ["reason"] }
          else: { not: { required: ["reason"] } }
        - if: { required: ["repeatOf"] }
          then: { properties: { repeat: { const: true } } }
    CorrectionsListInput:
      type: object
      additionalProperties: false
      properties:
        record: { $ref: "../schemas/contacts/common.json#/$defs/recordId" }
        limit: { type: "integer", minimum: 1, maximum: 5000, default: 500 }
        cursor: { type: "string", description: "next of the previous page." }
    CorrectionsListOutput:
      type: object
      required: ["items", "next"]
      properties:
        items: { type: "array", items: { $ref: "#/components/schemas/Correction" } }
        next: { type: ["string", "null"], description: "null on the last page." }
    ChangesListInput:
      type: object
      additionalProperties: false
      properties:
        since:
          type: string
          description: "The cursor of the last change that the app applied. Without it: every record."
        kinds:
          type: array
          items: { $ref: "../schemas/contacts/common.json#/$defs/kind" }
          uniqueItems: true
        person: { $ref: "../schemas/contacts/common.json#/$defs/personId" }
        limit: { type: "integer", minimum: 1, maximum: 5000, default: 500 }
    ChangesListOutput:
      type: object
      required: ["items", "next"]
      properties:
        items: { type: "array", items: { $ref: "#/components/schemas/Change" } }
        next: { type: ["string", "null"], description: "null on the last page." }
    ListInput:
      type: object
      additionalProperties: false
      properties:
        from: { $ref: "../schemas/user/common.json#/$defs/partialDate" }
        to: { $ref: "../schemas/user/common.json#/$defs/partialDate" }
        person:
          $ref: "../schemas/contacts/common.json#/$defs/personId"
          description: Records about this person. Contacts follows redirects, so a merged person's id finds the records of the person it was merged into.
        review: { type: "boolean", description: "true: only records for the review list." }
        includeRejected: { type: "boolean", default: false }
        includeMerged: { type: "boolean", default: false, description: "contacts.persons.list only: also list merged persons." }
        limit: { type: "integer", minimum: 1, maximum: 1000, default: 100 }
        cursor: { type: "string", description: "next of the previous page." }
    RecordPage:
      type: object
      required: ["items", "next"]
      properties:
        items: { type: "array", items: { $ref: "#/components/schemas/Record" } }
        next: { type: ["string", "null"], description: "null on the last page." }
    GetInput:
      type: object
      required: ["id"]
      additionalProperties: false
      properties: { id: { $ref: "../schemas/contacts/common.json#/$defs/recordId" } }
    RecordEnvelope:
      type: object
      required: ["record"]
      properties: { record: { $ref: "#/components/schemas/Record" } }
