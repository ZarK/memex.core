openapi: "3.1.0"
info:
  title: Memex.Contacts API
  version: "1"
  summary: Facts about other people, fused from the claims of every app, with corrections, merges, and a change feed.
  description: |-
    The contract text is contracts/contacts-records.md. The rules that Memex.Contacts shares with
    Memex.User (claims, joins, combining, provenance, corrections, the outbox, and the change feed)
    are in contracts/facts.md. The record shapes are in schemas/contacts/ and schemas/facts/.

    Contacts follows contracts/surfaces.md like every app: it listens on 127.0.0.1 on a port that the
    OS gives, with a new token at each launch, and the app record <apps>/contacts.json gives running.url
    and running.tokenFile. Every call except /health sends "Authorization: Bearer <token>". Errors use
    the one error body of contracts/surfaces.md.

    This file holds the facts capabilities only. Import, search, and the other capabilities of Contacts
    are in the Contacts repository.
  license: { name: "MIT", identifier: "MIT" }
servers:
  - url: "http://127.0.0.1:{port}"
    variables: { port: { default: "0", description: "running.url in <apps>/contacts.json." } }
security: [{ bearer: [] }]
tags:
  - { name: "claims" }
  - { name: "corrections" }
  - { name: "changes" }
  - { name: "persons" }
  - { name: "homes" }
  - { name: "workplaces" }
  - { name: "circles" }
  - { name: "relations" }
  - { name: "dates" }
  - { name: "identities" }
paths:
  /api/v1/contacts.claims.write:
    post:
      tags: ["claims"]
      operationId: claimsWrite
      summary: contacts.claims.write
      description: "Replace the claims of one scope, or of one partition of a scope. Every claim has a subject. Claims of the scope that are not in the request are withdrawn. Every claim of a request has the same generation; a lower generation than the last one of the scope or partition is refused with 409 conflict (code stale-generation). HTTP only; not on MCP. Kind: write."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ClaimsWriteInput" } } }
      responses:
        "200":
          description: Result.
          content: { application/json: { schema: { $ref: "#/components/schemas/ClaimsWriteOutput" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "421": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/contacts.corrections.write:
    post:
      tags: ["corrections"]
      operationId: correctionsWrite
      summary: contacts.corrections.write
      description: "Store corrections, merges, unmerges, and pins of the person (at most 500), by the rules of contracts/facts.md: each id once, ordered by createdAt, results in request order, held with a reason when stored and not applied. Contacts never drops a correction; 400 means the request is wrong and nothing is stored. A merge of persons always comes from the person, never from inference. Kind: write. MCP tool: contacts_corrections_write (destructiveHint)."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CorrectionsWriteInput" } } }
      responses:
        "200":
          description: Result.
          content: { application/json: { schema: { $ref: "#/components/schemas/CorrectionsWriteOutput" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "421": { $ref: "#/components/responses/Error" }
  /api/v1/contacts.corrections.list:
    post:
      tags: ["corrections"]
      operationId: correctionsList
      summary: contacts.corrections.list
      description: "List corrections, for one record or all of them, by createdAt, then by arrival. Kind: read. MCP tool: contacts_corrections_list. GET with ?input=<json> works as well."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CorrectionsListInput" } } }
      responses:
